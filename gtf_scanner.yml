name: GTF Nifty 500 Daily Screener (Monthly Support + Daily Execution)

on:
  schedule:
    # Runs Monday-Friday at 10:15 UTC (3:45 PM IST - after NSE market close)
    - cron: '15 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-gtf-scanner:
    runs-on: ubuntu-latest
    env:
      GTF_PASSWORD: "700460"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NSE 500 GTF Scanner Script
        run: |
          python3 nse_500_gtf_scanner.py

      - name: Commit & Push Updated Dashboard Excel to Repository
        run: |
          git config --global user.name "GTF Automated Scanner"
          git config --global user.email "gtf-scanner@github-actions.local"
          git add NIFTY500_GTF_Dashboard.xlsx NIFTY500_GTF_Dashboard.csv
          git commit -m "📊 Automated Daily NSE 500 GTF Scan [$(date +'%Y-%m-%d')]" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Excel Dashboard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIFTY500_GTF_Dashboard_Excel
          path: |
            NIFTY500_GTF_Dashboard.xlsx
            NIFTY500_GTF_Dashboard.csv
          retention-days: 30
