name: My Swing Dashboard — NSE 500 Auto-Filter

on:
  schedule:
    # Monday-Friday 10:15 UTC = 3:45 PM IST (after NSE close)
    - cron: "15 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-gtf-scanner:
    runs-on: ubuntu-latest
    env:
      GTF_PASSWORD: "7004602"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NSE 500 GTF Auto-Filter Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 nse_500_gtf_scanner.py

      - name: Commit live JSON + Excel back to repo (GitHub Pages feed)
        run: |
          git config --global user.name "My Swing Dashboard Bot"
          git config --global user.email "swing-dashboard@github-actions.local"
          git add gtf_live_data.json nifty500_universe.csv NIFTY500_GTF_Dashboard.xlsx NIFTY500_GTF_Dashboard.csv
          git commit -m "Auto-filter scan [$(date +'%Y-%m-%d')]" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swing-dashboard-scan
          path: |
            gtf_live_data.json
            NIFTY500_GTF_Dashboard.xlsx
            NIFTY500_GTF_Dashboard.csv
          retention-days: 30
